import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

plugins {
    id 'org.openapi.generator' version '7.21.0'
    id 'maven-publish'
    id 'java-gradle-plugin'
    id 'net.nemerosa.versioning' version '3.1.0'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly("jakarta.platform:jakarta.jakartaee-api:11.0.0")
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation("com.squareup.okhttp3:okhttp:5.3.2")
    implementation("io.swagger.codegen.v3:swagger-codegen:3.0.79")
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.46'
    implementation 'io.swagger.core.v3:swagger-jaxrs2:2.2.20'
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.6'
    implementation("org.openapitools:jackson-databind-nullable:0.2.6")
}

openApiValidate {
    inputSpec = "${rootDir}/src/main/resources/openapi.yaml"
}

openApiGenerate {
//    generatorName = 'jaxrs-spec'
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/openapi.yaml"
    configFile = "$rootDir/src/main/resources/config.yaml"
    // Keep generated server artifacts isolated to avoid output/input overlap warnings.
    outputDir = "$rootDir/src/gen"
    configOptions = [
            "useJakartaEe": "true",
            "delegatePattern": "true",
            "useOriginalPathParamNames": "true"
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDir "$rootDir/src/gen/java"
        }
    }
}

clean {
   delete "$rootDir/src/gen/"
}

// TypeScript client generation using OpenAPI Generator

def tsOutputDir = layout.buildDirectory.dir("generated-clients/typescript-angular").get().asFile.absolutePath
def tsPackDestination = layout.buildDirectory.dir("libs").get().asFile.absolutePath
// Single source of truth for Angular compatibility of the generated client.
def ngVersion = (findProperty('ngVersion') ?: '22.0.1') as String

def resolveNpmExecutable = {
    def fromProperty = findProperty('npmExecutable') as String
    if (fromProperty) {
        return fromProperty
    }

    def fromEnv = System.getenv('NPM_EXECUTABLE')
    if (fromEnv) {
        return fromEnv
    }

    def home = System.getProperty('user.home')
    def nvmCandidates = fileTree("${home}/.nvm/versions/node") {
        include '*/bin/npm'
    }.files.sort { a, b -> b.path <=> a.path }

    def fixedCandidates = [
            '/usr/bin/npm',
            '/usr/local/bin/npm',
            '/opt/homebrew/bin/npm'
    ].collect { file(it) }

    def firstExistingAbsolute = (nvmCandidates + fixedCandidates).find { it.exists() && it.canExecute() }
    if (firstExistingAbsolute != null) {
        return firstExistingAbsolute.absolutePath
    }

    // Final fallback: rely on PATH for environments where npm is globally available.
    return 'npm'
}

def npmExecutable = resolveNpmExecutable()

tasks.register('openApiGenerateTypescript', GenerateTask) {
    generatorName = 'typescript-angular'
    inputSpec     = "$rootDir/src/main/resources/openapi.yaml"
    configFile    = "$rootDir/src/main/resources/config-typescript.yaml"
    outputDir     = tsOutputDir
    additionalProperties = [
            ngVersion: ngVersion
    ]
}

tasks.register('normalizeTypescriptPackageForNg', DefaultTask) {
    dependsOn 'openApiGenerateTypescript'

    def packageJsonFile = file("$tsOutputDir/package.json")
    def markerFile = layout.buildDirectory.file("tmp/normalizeTypescriptPackageForNg.marker")
    def legacyMarkerInPackageRoot = file("$tsOutputDir/.package-normalized-for-ng")

    def resolveTargetVersions = {
        def major = ngVersion.tokenize('.').first()
        [
                major          : major,
                ngPackagrRange : "^${major}.0.0",
                typescriptRange: major == '22' ? '>=6.0.0 <6.1.0' : null
        ]
    }

    // Task state is driven by ngVersion and current generated files.
    inputs.property('ngVersion', ngVersion)
    outputs.file(markerFile)
    // This task mutates generated files; avoid stale up-to-date snapshots on rewritten package.json.
    outputs.upToDateWhen { false }

    onlyIf {
        if (!packageJsonFile.exists()) {
            return false
        }

        def targets = resolveTargetVersions()
        def json = new JsonSlurper().parse(packageJsonFile)
        def devDependencies = (json.devDependencies instanceof Map) ? json.devDependencies : [:]

        def ngPackagrMismatch = devDependencies['ng-packagr'] != targets.ngPackagrRange
        def typescriptMismatch = targets.typescriptRange != null && devDependencies['typescript'] != targets.typescriptRange
        def hasStaleLockFiles = [
                file("$tsOutputDir/package-lock.json"),
                file("$tsOutputDir/npm-shrinkwrap.json")
        ].any { it.exists() }

        ngPackagrMismatch || typescriptMismatch || hasStaleLockFiles || legacyMarkerInPackageRoot.exists()
    }

    doLast {
        if (!packageJsonFile.exists()) {
            throw new GradleException("Generated package.json not found at ${packageJsonFile}")
        }

        def targets = resolveTargetVersions()

        def json = new JsonSlurper().parse(packageJsonFile)
        if (!(json.devDependencies instanceof Map)) {
            json.devDependencies = [:]
        }

        // Force ng-packagr major to align with Angular major to avoid npm ERESOLVE.
        json.devDependencies['ng-packagr'] = targets.ngPackagrRange
        // Angular 22 toolchain requires TypeScript 6.x.
        if (targets.typescriptRange != null) {
            json.devDependencies['typescript'] = targets.typescriptRange
        }

        packageJsonFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(json)) + '\n'

        // Drop stale lockfiles so npm resolves dependencies from the patched package.json.
        [
                file("$tsOutputDir/package-lock.json"),
                file("$tsOutputDir/npm-shrinkwrap.json")
        ].findAll { it.exists() }.each { it.delete() }

        // Remove legacy marker from package root so it is never included in the .tgz.
        if (legacyMarkerInPackageRoot.exists()) {
            legacyMarkerInPackageRoot.delete()
        }

        def marker = markerFile.get().asFile
        marker.parentFile.mkdirs()
        marker.text = "ngVersion=${ngVersion}\n"
    }
}

tasks.register('npmInstallTypescript', Exec) {
    dependsOn 'normalizeTypescriptPackageForNg'
    workingDir tsOutputDir
    commandLine npmExecutable, 'install'

    // Incremental: rerun only when npm dependency manifests change or node_modules is missing.
    inputs.files(fileTree(tsOutputDir) {
        include 'package.json', 'package-lock.json', 'npm-shrinkwrap.json'
    })
    outputs.dir("$tsOutputDir/node_modules")
}

tasks.register('npmPackTypescript', Exec) {
    dependsOn 'npmInstallTypescript'
    workingDir tsOutputDir
    commandLine npmExecutable, 'pack', '--pack-destination', tsPackDestination
    description = 'Generates and packs the Angular TypeScript client as an npm .tgz into build/libs'

    // Incremental: rerun only when generated package sources/manifests changed.
    inputs.files(fileTree(tsOutputDir) {
        exclude 'node_modules/**', '.git/**', '.openapi-generator/**', '*.tgz'
    })
    outputs.files(fileTree(tsPackDestination) {
        include '*.tgz'
    })
}

// Ensure every Gradle build also produces the packaged TypeScript client (.tgz)
tasks.named('build') {
    dependsOn 'npmPackTypescript'
}

// Ensure assemble also produces the packaged TypeScript client (.tgz)
tasks.named('assemble') {
    dependsOn 'npmPackTypescript'
}

tasks.named('processTestResources') {
    enabled = false
}

// ─────────────────────────────────────────────────────────────────────────────

tasks.openApiGenerate.dependsOn('processResources')
tasks.openApiGenerateTypescript.dependsOn('processResources')
tasks.sourcesJar.dependsOn('openApiGenerate')
tasks.compileJava.dependsOn('sourcesJar')
tasks.publishToMavenLocal.dependsOn('compileJava')

publishing {
    publications {
        maven(MavenPublication) {
            groupId = findProperty('group') as String
            artifactId = findProperty('name') as String
            version = "${findProperty('version')}-${findProperty('classifier')}"

            from components.java
        }
    }
}
